name: Build and deploy site
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pandoc and LaTeX
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y pandoc texlive-xetex texlive-latex-recommended fonts-freefont-ttf
      # On main: real content. On other branches: placeholder fixtures (build test only).
      - name: Build
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then python3 scripts/build.py
          else python3 scripts/build.py --src tests/fixtures; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _build/site
      # Non-main builds (placeholder content): keep the books for a look.
      - uses: actions/upload-artifact@v4
        if: github.ref != 'refs/heads/main'
        with:
          name: books-preview
          path: |
            _build/site/*.pdf
            _build/site/*.epub
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
